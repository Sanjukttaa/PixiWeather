:root{
  --bg-dark:#0a1628;--bg-mid:#1a3a6b;--acc:#2d6be4;--light:#7eb8f7;

body{
  font-family:'Press Start 2P',monospace;
  background:var(--bg-dark);
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  padding:24px 12px;
  overflow-x:hidden;position:relative;
  transition:background 1.5s ease;
}

  image-rendering:pixelated;
}
.sky::after{
  content:'';position:absolute;inset:0;
  transition:background 1.5s ease;
}
.sky.sunny::after{background:rgba(26,107,212,.15)}
.sky.cloudy::after{background:rgba(10,22,40,.35)}
.sky.rainy::after{background:rgba(5,13,26,.65)}
.sky.snowy::after{background:rgba(26,48,96,.45)}
.sky.stormy::after{background:rgba(5,10,20,.78)}
.sky.night::after{background:rgba(2,8,16,.82)}
.sky.foggy::after{background:rgba(42,74,107,.5)}

/* ── Stars (night) ───────────────────────────────────── */
.stars{position:fixed;inset:0;z-index:1;pointer-events:none;display:none}
.star{position:absolute;background:#e8f4ff;animation:twinkle 2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.2}}

/* ── Pixel clouds background ─────────────────────────── */
.clouds-bg{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.cloud-bg{position:absolute;background:#e8f4ff;opacity:.15;animation:driftCloud linear infinite}
@keyframes driftCloud{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}

/* ── Rain ────────────────────────────────────────────── */
.rain-container{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none}
.raindrop{position:absolute;width:2px;background:var(--rain);opacity:.6;animation:falling linear infinite;top:-20px}
@keyframes falling{to{transform:translateY(110vh)}}

/* ── Snow ────────────────────────────────────────────── */
.snow-container{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden;display:none}
.snowflake{position:absolute;background:#e3f2fd;animation:snowfall linear infinite;top:-10px}
@keyframes snowfall{to{transform:translateY(110vh) translateX(30px)}}

/* ── Card ─────────────────────────────────────────────── */
.card{
  position:relative;z-index:10;
  width:520px;max-width:95vw;
  background:rgba(10,22,40,.85);
  border:4px solid var(--light);
  box-shadow:8px 8px 0 var(--shadow), inset 0 0 0 2px rgba(126,184,247,.1);
  padding:20px 24px 18px;
  animation:slideUp .6s cubic-bezier(.17,.67,.35,1.2) both;
  backdrop-filter:blur(4px);
}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Location ─────────────────────────────────────────── */
.location{
  font-size:7px;color:var(--pale);
  text-align:center;margin-bottom:18px;
  letter-spacing:.5px;line-height:1.8;
  border-bottom:2px solid rgba(126,184,247,.25);
  padding-bottom:12px;
}
.location span{color:var(--light);font-size:8px}
.pin{color:var(--acc);margin-right:4px;animation:bounce .8s ease-in-out infinite alternate}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-3px)}}

/* ── GPS + Search ─────────────────────────────────────── */
.location-row{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:8px}
.location-row .pin{flex-shrink:0}
#cityName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.gps-btn{
  flex-shrink:0;background:transparent;
  border:2px solid var(--light);color:var(--light);
  font-family:'Press Start 2P',monospace;font-size:7px;
  padding:4px 7px;cursor:pointer;min-height:28px;line-height:1;
  transition:background .15s;
}
.gps-btn:hover{background:rgba(126,184,247,.2)}
.gps-btn:disabled{opacity:.5;cursor:not-allowed}
.search-row{display:flex;gap:6px;margin-bottom:4px}
.search-input{
  flex:1;background:rgba(255,255,255,.07);
  border:2px solid var(--light);color:var(--txt);
  font-family:'Press Start 2P',monospace;font-size:7px;
  padding:7px 10px;outline:none;min-height:34px;
}
.search-input::placeholder{color:rgba(184,217,255,.4);font-size:6px}
.search-input:focus{border-color:#7eb8f7;background:rgba(255,255,255,.12)}
.search-go{
  background:var(--acc);border:2px solid var(--light);
  color:#fff;font-family:'Press Start 2P',monospace;
  font-size:7px;padding:7px 10px;cursor:pointer;min-height:34px;
}
.search-go:hover{background:#3d7bf4}

/* ── Weather Icon ─────────────────────────────────────── */
.icon-wrap{
  display:flex;justify-content:center;align-items:center;
  height:72px;margin:2px 0 8px;
}

/* Sun */
.pixel-sun{position:relative;width:44px;height:44px;flex-shrink:0}
.sun-core{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:24px;height:24px;background:var(--sunny);
  box-shadow:4px 0 0 var(--sunny),-4px 0 0 var(--sunny),0 4px 0 var(--sunny),0 -4px 0 var(--sunny),
    2px 2px 0 var(--sunny),-2px 2px 0 var(--sunny),2px -2px 0 var(--sunny),-2px -2px 0 var(--sunny);
}
.sun-rays{
  position:absolute;inset:-10px;
  animation:rotateSun 4s linear infinite;
}
.sun-ray{position:absolute;width:4px;height:8px;background:var(--sunny);left:50%;margin-left:-2px}
.sun-ray:nth-child(1){top:0;transform-origin:50% 28px;transform:rotate(0deg)}
.sun-ray:nth-child(2){top:0;transform-origin:50% 28px;transform:rotate(45deg)}
.sun-ray:nth-child(3){top:0;transform-origin:50% 28px;transform:rotate(90deg)}
.sun-ray:nth-child(4){top:0;transform-origin:50% 28px;transform:rotate(135deg)}
.sun-ray:nth-child(5){top:0;transform-origin:50% 28px;transform:rotate(180deg)}
.sun-ray:nth-child(6){top:0;transform-origin:50% 28px;transform:rotate(225deg)}
.sun-ray:nth-child(7){top:0;transform-origin:50% 28px;transform:rotate(270deg)}
.sun-ray:nth-child(8){top:0;transform-origin:50% 28px;transform:rotate(315deg)}
@keyframes rotateSun{from{transform:rotate(0)}to{transform:rotate(360deg)}}

/* Moon */
.pixel-moon{width:40px;height:40px;position:relative;animation:moonGlow 3s ease-in-out infinite}
.moon-body{
  width:32px;height:32px;background:#ffd700;
  position:absolute;top:4px;left:4px;
  clip-path:polygon(100% 0,100% 100%,50% 100%,30% 80%,20% 60%,20% 40%,30% 20%,50% 0);
}
.moon-star{position:absolute;background:#ffd700}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 6px #ffd700)}50%{filter:drop-shadow(0 0 14px #ffd700)}}

/* Cloud */
.pixel-cloud{position:relative;animation:floatCloud 3s ease-in-out infinite}
.cloud-body{
  width:60px;height:24px;background:var(--pale);
  position:relative;
  box-shadow:
    -8px 8px 0 var(--pale),8px 8px 0 var(--pale),
    0px -8px 0 var(--pale),8px -8px 0 var(--pale),
    16px 0 0 var(--pale),-16px 0 0 var(--pale);
}
.cloud-body::before{
  content:'';position:absolute;width:24px;height:20px;
  background:var(--pale);top:-12px;left:8px;
}
.cloud-body::after{
  content:'';position:absolute;width:20px;height:16px;
  background:var(--pale);top:-8px;right:8px;
}
@keyframes floatCloud{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Rain cloud */
.pixel-rain{display:flex;flex-direction:column;align-items:center;gap:8px}
.rain-drops{display:flex;gap:6px}
.rdrop{width:4px;height:12px;background:var(--rain);animation:dropFall .8s ease-in infinite}
.rdrop:nth-child(2){animation-delay:.2s;height:10px}
.rdrop:nth-child(3){animation-delay:.4s;height:14px}
.rdrop:nth-child(4){animation-delay:.1s;height:10px}
.rdrop:nth-child(5){animation-delay:.3s;height:12px}
@keyframes dropFall{0%{transform:translateY(-4px);opacity:0}50%{opacity:1}100%{transform:translateY(8px);opacity:0}}

/* Snow icon */
.pixel-snow{display:flex;flex-direction:column;align-items:center;gap:8px}
.snow-drops{display:flex;gap:8px}
.sdrop{width:6px;height:6px;background:#e3f2fd;animation:snowDrop 1.2s ease-in infinite}
.sdrop:nth-child(2){animation-delay:.3s}
.sdrop:nth-child(3){animation-delay:.6s}
.sdrop:nth-child(4){animation-delay:.9s}
@keyframes snowDrop{0%{transform:translateY(-4px) rotate(0);opacity:0}50%{opacity:1}100%{transform:translateY(10px) rotate(90deg);opacity:0}}

/* Storm */
.pixel-storm{display:flex;flex-direction:column;align-items:center;gap:4px}
.lightning{
  width:0;height:0;
  border-left:8px solid transparent;border-right:8px solid transparent;
  position:relative;
  animation:zap .6s ease-in-out infinite;
}
.lightning::before{content:'⚡';font-size:28px;position:absolute;left:-14px;top:-14px;animation:zap .6s ease-in-out infinite}
@keyframes zap{0%,100%{opacity:1;filter:drop-shadow(0 0 4px #ffd700)}50%{opacity:.3;filter:none}}

/* Fog */
.pixel-fog{display:flex;flex-direction:column;gap:8px;align-items:center}
.fog-line{height:6px;background:rgba(184,217,255,.5);animation:fogDrift 2s ease-in-out infinite}
.fog-line:nth-child(1){width:60px;animation-delay:0s}
.fog-line:nth-child(2){width:44px;animation-delay:.3s}
.fog-line:nth-child(3){width:52px;animation-delay:.6s}
@keyframes fogDrift{0%,100%{transform:translateX(0);opacity:.5}50%{transform:translateX(6px);opacity:.8}}

/* ── Temperature ─────────────────────────────────────── */
.temp{
  text-align:center;
  font-size:36px;color:var(--txt);
  letter-spacing:-1px;margin-bottom:6px;
  text-shadow:4px 4px 0 var(--shadow);
}
.condition{
  text-align:center;font-size:7px;
  color:var(--light);margin-bottom:18px;
  letter-spacing:1px;
}

/* ── Stats grid ──────────────────────────────────────── */
.stats{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:18px;
  border-top:2px solid rgba(126,184,247,.25);
  padding-top:14px;
}
.stat{
  background:rgba(45,106,228,.15);
  border:2px solid rgba(126,184,247,.2);
  padding:8px 6px;text-align:center;
}
.stat-icon{font-size:14px;display:block;margin-bottom:5px}
.stat-val{font-size:7px;color:var(--txt);display:block;margin-bottom:3px}
.stat-lbl{font-size:6px;color:var(--pale);opacity:.7}

/* ── Refresh button ──────────────────────────────────── */
.refresh-btn{
  display:block;width:100%;
  background:var(--acc);color:var(--txt);
  border:4px solid var(--light);
  font-family:'Press Start 2P',monospace;
  font-size:8px;letter-spacing:1px;
  padding:14px 8px;cursor:pointer;
  text-transform:uppercase;
  box-shadow:4px 4px 0 var(--shadow);
  transition:transform .1s,box-shadow .1s;
  min-height:44px;
}
.refresh-btn:hover{background:#3d7bf4;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--shadow)}
.refresh-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--shadow)}
.refresh-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ── Loading ─────────────────────────────────────────── */
.loading{text-align:center;padding:20px 0}
.load-text{font-size:7px;color:var(--light);margin-bottom:14px;letter-spacing:1px}
.pixel-loader{
  width:120px;height:10px;
  border:3px solid var(--acc);
  margin:0 auto;
  position:relative;overflow:hidden;
}
.pixel-loader::after{
  content:'';position:absolute;
  top:0;left:-100%;width:100%;height:100%;
  background:var(--acc);
  animation:loadBar 1.2s linear infinite;
}
@keyframes loadBar{from{left:-100%}to{left:100%}}

/* ── Error ───────────────────────────────────────────── */
.error{
  text-align:center;padding:12px 0;
  font-size:7px;color:#ff6b6b;line-height:2.2;
}

/* ── Last updated ────────────────────────────────────── */
.updated{
  text-align:center;font-size:6px;
  color:rgba(184,217,255,.4);margin-top:12px;
  letter-spacing:.5px;
}

/* ── Forecast sections ───────────────────────────────── */
.forecast-section{
  margin-top:6px;margin-bottom:16px;
  border-top:2px solid rgba(126,184,247,.25);
  padding-top:12px;
}
.section-title{
  font-size:7px;color:var(--light);
  letter-spacing:1px;margin-bottom:10px;
  text-align:left;
}

/* Daily list */
.daily-list{display:flex;flex-direction:column;gap:4px}
.day-row{
  display:grid;
  grid-template-columns:48px 22px 1fr 36px 36px;
  align-items:center;gap:8px;
  background:rgba(45,106,228,.12);
  border:2px solid rgba(126,184,247,.18);
  padding:8px 8px;
}
.day-row.today{
  background:rgba(45,106,228,.35);
  border-color:var(--light);
}
.day-name{font-size:7px;color:var(--pale);letter-spacing:.5px}
.day-emoji{font-size:14px;text-align:center;line-height:1}
.day-bar-wrap{
  position:relative;height:4px;
  background:rgba(126,184,247,.18);
}
.day-bar{
  position:absolute;top:0;height:100%;
  background:linear-gradient(90deg,#4fc3f7,#ffd700,#ff6b6b);
}
.day-min{font-size:7px;color:var(--pale);text-align:right}
.day-max{font-size:7px;color:var(--txt);text-align:right}

/* ── Pixel corner decorations ────────────────────────── */
.card::before,.card::after{
  content:'';position:absolute;
  width:8px;height:8px;background:var(--acc);
}
.card::before{top:-4px;left:-4px}
.card::after{bottom:-4px;right:-4px}
</style>
</head>
<body>

<!-- Sky -->
<div class="sky" id="sky"></div>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Drifting clouds -->
<div class="clouds-bg" id="cloudsBg"></div>

<!-- Rain -->
<div class="rain-container" id="rainCont"></div>

<!-- Snow -->
<div class="snow-container" id="snowCont"></div>

<!-- Main card -->
<div class="card" id="card">
  <div class="loading" id="loading">
    <div class="load-text">LOADING WEATHER...</div>
    <div class="pixel-loader"></div>
  </div>
  <div id="weatherContent" style="display:none">
    <div class="location">
      <div class="location-row">
        <span class="pin">📍</span>
        <span id="cityName">—</span>
        <button class="gps-btn" id="gpsBtn" onclick="useGPS()" title="Use exact GPS">🎯 GPS</button>
      </div>
      <div class="search-row">
        <input class="search-input" id="searchInput" type="text" placeholder="SEARCH CITY..."
          onkeydown="if(event.key==='Enter')searchCity()">
        <button class="search-go" onclick="searchCity()">GO</button>
      </div>
    </div>
    <div class="icon-wrap" id="iconWrap"></div>
    <div class="temp" id="temp">—°</div>
    <div class="condition" id="condition">—</div>
    <div class="stats">
      <div class="stat">
        <span class="stat-icon">💧</span>
        <span class="stat-val" id="humidity">—%</span>
        <span class="stat-lbl">HUMIDITY</span>
      </div>
      <div class="stat">
        <span class="stat-icon">💨</span>
        <span class="stat-val" id="wind">— km/h</span>
        <span class="stat-lbl">WIND</span>
      </div>
      <div class="stat">
        <span class="stat-icon">🌡️</span>
        <span class="stat-val" id="feelsLike">—°</span>
        <span class="stat-lbl">FEELS LIKE</span>
      </div>
      <div class="stat">
        <span class="stat-icon">👁️</span>
        <span class="stat-val" id="uvIndex">—</span>
        <span class="stat-lbl">UV INDEX</span>
      </div>
    </div>


    <button class="refresh-btn" id="refreshBtn" onclick="loadWeather()">
      ↻ REFRESH
    </button>
    <div class="updated" id="updated"></div>
  </div>
  <div id="errorMsg" style="display:none" class="error"></div>
</div>

<script>
const WMO = {
  0:  {label:'Clear Sky',   type:'sunny'},
  1:  {label:'Mainly Clear',type:'sunny'},
  2:  {label:'Partly Cloudy',type:'cloudy'},
  3:  {label:'Overcast',    type:'cloudy'},
  45: {label:'Foggy',       type:'foggy'},
  48: {label:'Icy Fog',     type:'foggy'},
  51: {label:'Light Drizzle',type:'rainy'},
  53: {label:'Drizzle',     type:'rainy'},
  55: {label:'Heavy Drizzle',type:'rainy'},
  61: {label:'Light Rain',  type:'rainy'},
  63: {label:'Rain',        type:'rainy'},
  65: {label:'Heavy Rain',  type:'rainy'},
  71: {label:'Light Snow',  type:'snowy'},
  73: {label:'Snow',        type:'snowy'},
  75: {label:'Heavy Snow',  type:'snowy'},
  77: {label:'Snow Grains', type:'snowy'},
  80: {label:'Light Showers',type:'rainy'},
  81: {label:'Showers',     type:'rainy'},
  82: {label:'Heavy Showers',type:'rainy'},
  85: {label:'Snow Showers',type:'snowy'},
  86: {label:'Heavy Snow Showers',type:'snowy'},
  95: {label:'Thunderstorm',type:'stormy'},
  96: {label:'Storm + Hail',type:'stormy'},
  99: {label:'Storm + Hail',type:'stormy'},
};

function buildStars() {
  const el = document.getElementById('stars');
  el.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < 0.3 ? 3 : 2;
    s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*90}%;left:${Math.random()*100}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2}s`;
    el.appendChild(s);
  }
}

function buildBgClouds() {
  const el = document.getElementById('cloudsBg');
  el.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud-bg';
    const h = 30 + i * 18;
    const dur = 18 + i * 8;
    const w = 80 + Math.random() * 80;
    c.style.cssText = `top:${h}%;width:${w}px;height:${w*0.4}px;border-radius:${w}px;animation-duration:${dur}s;animation-delay:-${dur*Math.random()}s`;
    el.appendChild(c);
  }
}

function buildRain() {
  const el = document.getElementById('rainCont');
  el.innerHTML = '';
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div');
    d.className = 'raindrop';
    const h = 6 + Math.random() * 16;
    d.style.cssText = `left:${Math.random()*100}%;height:${h}px;animation-duration:${0.5+Math.random()*0.5}s;animation-delay:${Math.random()*1}s`;
    el.appendChild(d);
  }
}

function buildSnow() {
  const el = document.getElementById('snowCont');
  el.innerHTML = '';
  for (let i = 0; i < 40; i++) {
    const s = document.createElement('div');
    s.className = 'snowflake';
    const size = 3 + Math.floor(Math.random() * 4);
    s.style.cssText = `left:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    el.appendChild(s);
  }
}

function setScene(type, isNight) {
  const sky = document.getElementById('sky');
  const stars = document.getElementById('stars');
  const rain = document.getElementById('rainCont');
  const snow = document.getElementById('snowCont');

  sky.className = 'sky ' + (isNight ? 'night' : type);
  stars.style.display = isNight ? 'block' : 'none';
  rain.style.display = type === 'rainy' ? 'block' : 'none';
  snow.style.display = type === 'snowy' ? 'block' : 'none';
}

function buildIcon(type, isNight) {
  const wrap = document.getElementById('iconWrap');
  wrap.innerHTML = '';

  if (isNight && type === 'sunny') type = 'night';

  const icons = {
    sunny: `<div class="pixel-sun"><div class="sun-core"></div><div class="sun-rays">${'<div class="sun-ray"></div>'.repeat(8)}</div></div>`,
    night: `<div class="pixel-moon"><div class="moon-body"></div></div>`,
    cloudy: `<div class="pixel-cloud"><div class="cloud-body"></div></div>`,
    rainy: `<div class="pixel-rain"><div class="pixel-cloud"><div class="cloud-body" style="transform:scale(.7)"></div></div><div class="rain-drops">${'<div class="rdrop"></div>'.repeat(5)}</div></div>`,
    snowy: `<div class="pixel-snow"><div class="pixel-cloud"><div class="cloud-body" style="transform:scale(.7)"></div></div><div class="snow-drops">${'<div class="sdrop"></div>'.repeat(4)}</div></div>`,
    stormy: `<div class="pixel-storm"><div class="pixel-cloud"><div class="cloud-body" style="background:#7eb8f7;transform:scale(.7)"></div></div><div class="lightning"></div></div>`,
    foggy: `<div class="pixel-fog"><div class="fog-line"></div><div class="fog-line"></div><div class="fog-line"></div></div>`,
  };
  wrap.innerHTML = icons[type] || icons.sunny;
}

function showLoading(yes) {
  document.getElementById('loading').style.display = yes ? 'block' : 'none';
  document.getElementById('weatherContent').style.display = yes ? 'none' : 'block';
  document.getElementById('errorMsg').style.display = 'none';
  if (document.getElementById('refreshBtn'))
    document.getElementById('refreshBtn').disabled = yes;
}

function showError(msg) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('weatherContent').style.display = 'none';
  const el = document.getElementById('errorMsg');
  el.style.display = 'block';
  el.innerHTML = `⚠️<br><br>${msg}<br><br><button class="refresh-btn" onclick="loadWeather()" style="margin-top:12px">↻ TRY AGAIN</button>`;
}

async function getLocationByIP() {
  // Try primary IP geolocation provider, then fall back. No permission prompt — works on every device.
  const providers = [
    async () => {
      const r = await fetch('https://ipapi.co/json/');
      if (!r.ok) throw new Error('ipapi failed');
      const d = await r.json();
      return {
        lat: d.latitude, lon: d.longitude,
        city: d.city || 'Unknown',
        country: (d.country_code || '').toUpperCase()
      };
    },
    async () => {
      const r = await fetch('https://get.geojs.io/v1/ip/geo.json');
      if (!r.ok) throw new Error('geojs failed');
      const d = await r.json();
      return {
        lat: parseFloat(d.latitude), lon: parseFloat(d.longitude),
        city: d.city || 'Unknown',
        country: (d.country_code || '').toUpperCase()
      };
    }
  ];
  let lastErr;
  for (const p of providers) {
    try { return await p(); } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Could not detect location');
}

// ── GPS exact location ────────────────────────────────────
async function useGPS() {
  if (!navigator.geolocation) { showError('GPS NOT SUPPORTED ON THIS DEVICE.'); return; }
  const btn = document.getElementById('gpsBtn');
  btn.textContent = '⏳...'; btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      btn.textContent = '🎯 GPS'; btn.disabled = false;
      const { latitude: lat, longitude: lon } = pos.coords;
      showLoading(true);
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);
        const d = await r.json();
        const city = d.address.city || d.address.town || d.address.village || d.address.county || 'My Location';
        const country = (d.address.country_code || '').toUpperCase();
        await fetchAndRender(lat, lon, `${city}, ${country}`);
      } catch { await fetchAndRender(pos.coords.latitude, pos.coords.longitude, 'My Location'); }
    },
    () => { btn.textContent = '🎯 GPS'; btn.disabled = false; showError('GPS DENIED. ALLOW LOCATION IN BROWSER SETTINGS.'); },
    { timeout: 10000, enableHighAccuracy: true }
  );
}

// ── City search ───────────────────────────────────────────
async function searchCity() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) return;
  showLoading(true);
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1`);
    const results = await r.json();
    if (!results.length) { showLoading(false); showError(`CITY NOT FOUND: "${q.toUpperCase()}"`); return; }
    const { lat, lon, display_name } = results[0];
    const parts = display_name.split(',');
    const city = parts[0].trim();
    const country = parts[parts.length - 1].trim();
    document.getElementById('searchInput').value = '';
    await fetchAndRender(parseFloat(lat), parseFloat(lon), `${city}, ${country}`);
  } catch { showLoading(false); showError('SEARCH FAILED. CHECK CONNECTION.'); }
}

// ── Shared fetch + render ─────────────────────────────────
async function fetchAndRender(lat, lon, cityName) {
  showLoading(true);
  try {
    const url = `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${lat}&longitude=${lon}` +
      `&current=temperature_2m,relative_humidity_2m,apparent_temperature,` +
      `weather_code,wind_speed_10m,is_day,uv_index` +
      `&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const cur = data.current;
    if (!cur) throw new Error('Bad response');
    const now       = new Date();
    const tempC     = Math.round(cur.temperature_2m);
    const feelsLike = Math.round(cur.apparent_temperature);
    const humidity  = cur.relative_humidity_2m ?? '--';
    const uv        = cur.uv_index != null ? cur.uv_index.toFixed(1) : '--';
    const windspeed = cur.wind_speed_10m != null ? cur.wind_speed_10m.toFixed(1) : '--';
    const isNight   = cur.is_day === 0;
    const wmoInfo   = WMO[cur.weather_code] || { label: 'Unknown', type: 'cloudy' };
    document.getElementById('cityName').textContent  = cityName;
    document.getElementById('temp').textContent      = `${tempC}°C`;
    document.getElementById('condition').textContent = wmoInfo.label.toUpperCase();
    document.getElementById('humidity').textContent  = `${humidity}%`;
    document.getElementById('wind').textContent      = `${windspeed} km/h`;
    document.getElementById('feelsLike').textContent = `${feelsLike}°C`;
    document.getElementById('uvIndex').textContent   = uv;
    document.getElementById('updated').textContent   = `UPDATED ${now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`;
    setScene(wmoInfo.type, isNight);
    buildIcon(wmoInfo.type, isNight);
    showLoading(false);
  } catch(e) {
    console.error(e);
    showError('COULD NOT LOAD WEATHER DATA. CHECK CONNECTION.');
  }
}

async function loadWeather() {
  showLoading(true);
  try {
    const loc = await getLocationByIP();
    await fetchAndRender(loc.lat, loc.lon, `${loc.city}, ${loc.country}`);
  } catch(e) {
    console.error(e);
    showError('COULD NOT LOAD WEATHER DATA. CHECK CONNECTION.');
  }
}

// Emoji map for forecast rows (compact)
const TYPE_EMOJI = {
  sunny:'☀️', night:'🌙', cloudy:'☁️',
  rainy:'🌧️', snowy:'❄️', stormy:'⛈️', foggy:'🌫️'
};
function emojiFor(code, isDay=1){
  const info = WMO[code] || {type:'cloudy'};
  let t = info.type;
  if (t === 'sunny' && !isDay) t = 'night';
  return TYPE_EMOJI[t] || '☁️';
}




// Init
buildStars();
buildBgClouds();
buildRain();
buildSnow();
document.getElementById('sky').className = 'sky cloudy';
loadWeather();
</script>
</body>
</html>
